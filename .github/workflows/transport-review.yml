name: Transport Review

# Posts / updates a comment linking each push of a PR to its transport review on the workbench,
# which draws the changed transport and destination rows on the planner's map. Runs master's
# workflow and script with pull_request_target and never checks out or runs PR code: the link is
# built from the event's commit ids alone.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "src/main/resources/transports/**"
      - "src/main/resources/destinations/**"

permissions:
  pull-requests: write

concurrency:
  group: transport-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment:
    name: Post Transport Review Comment
    runs-on: ubuntu-latest
    steps:
      # pull_request_target checks out the base branch, not the PR.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/transport-review-comment.js
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Post or update comment
        uses: actions/github-script@v7
        with:
          script: |
            const run = require('./scripts/transport-review-comment.js');
            await run({ github, context });
