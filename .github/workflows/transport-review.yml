name: Transport Review

# Posts / updates a comment linking each push of a PR to its transport review on the workbench,
# which draws the changed transport and destination rows on the planner's map. Runs master's
# workflow with pull_request_target and never checks out or runs PR code: the link is built from
# the event's commit ids alone.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "src/main/resources/transports/**"
      - "src/main/resources/destinations/**"

permissions:
  pull-requests: write

concurrency:
  group: transport-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment:
    name: Post Transport Review Comment
    runs-on: ubuntu-latest
    steps:
      - name: Post or update comment
        uses: actions/github-script@v7
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const MARKER = '<!-- transport-review -->';
            // The coordinate previews' comment, which this one replaces in place.
            const OLD_MARKER = '<!-- osrs-coordinate-preview -->';
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            // The link names this push, so it keeps showing these rows after later pushes.
            const page = `https://workbench.collisionlab.world/github/${owner}/${repo}/pull/${number}/files/${process.env.BASE}..${process.env.HEAD}`;
            const body = [
              MARKER,
              `**[See this PR's transport changes on the map →](${page})**`,
              `Each changed row is drawn on the planner's map, with its floors, insets and collision. (For ${process.env.HEAD.slice(0, 7)}.)`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
            const ours = comments.filter(comment => comment.user.type === 'Bot');
            const existing = ours.find(comment => comment.body.includes(MARKER)) ?? ours.find(comment => comment.body.includes(OLD_MARKER));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
